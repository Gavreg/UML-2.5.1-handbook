<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="850" viewBox="0 0 1040 850" role="img" aria-labelledby="diagram-title diagram-description" data-figure="10.1">
  <title id="diagram-title">Рисунок 10.1 — Типы данных</title>
  <desc id="diagram-description">Абстрактный синтаксис DataType, Enumeration, EnumerationLiteral и PrimitiveType: атрибуты и операции типа данных, литералы перечисления и классификатор литерала.</desc>
  <defs>
    <marker id="generalization" markerWidth="15" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 13 8 L 1 15 Z" fill="#ffffff" stroke="#111111" stroke-width="1.4"/></marker>
    <marker id="navigation" markerWidth="9" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker>
    <marker id="navigation-start" markerWidth="9" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker>
    <marker id="annotation" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#8a2d2d"/></marker>
    <style>.background, .class-box, .package-box, .note-box { fill: #ffffff; }
  .class-box, .package-box, .note-box, .association, .generalization-line,
  .class-divider, .example-association, .dependency-line, .note-link { stroke: #111111; stroke-width: 1.4; }
  .association, .generalization-line, .class-divider, .example-association,
  .dependency-line, .note-link { fill: none; }
  .class-divider { stroke-width: 1; }
  text { fill: #111111; font-family: Arial, Helvetica, sans-serif; font-size: 16px; }
  .class-name { font-weight: 700; }
  .abstract { font-style: italic; }
  .attribute, .operation { font-size: 14px; }
  .association-end, .association-label, .example-association-group .example-label { font-size: 14px; }
  .end-dot, .composition { fill: #111111; }
  .dependency-line, .note-link { stroke-dasharray: 7 5; }
  .template-signature { stroke-dasharray: 4 3; }
  a { cursor: pointer; }
  a:hover .class-box, a:hover .note-box { fill: #eef3fb; stroke: #1e3a8a; }
  a:focus-visible { outline: none; }
  a:focus-visible .class-box, a:focus-visible .note-box { stroke: #7c3aed; stroke-width: 3; }
  .association, .example-association, .dependency-line { pointer-events: stroke; }
  .association-hitbox { fill: none; stroke: transparent; stroke-width: 12; pointer-events: stroke; }
  .association-group:hover .association, .example-association-group:hover .example-association,
  .dependency-group:hover .dependency-line { stroke: #1e3a8a; stroke-width: 2.2; }
  .association-group:hover text, .example-association-group:hover text,
  .dependency-group:hover text { fill: #1e3a8a; }
  .association-group:hover .end-dot, .association-group:hover .composition,
  .example-association-group:hover .end-dot { fill: #1e3a8a; }
  .association-end { cursor: help; }
  .sequence-frame, .sequence-lifeline, .sequence-message, .sequence-observation, .sequence-constraint { fill: none; stroke: #111111; stroke-width: 1.4; }
  .sequence-lifeline { stroke-dasharray: 7 5; }
  .annotation-line { fill: none; stroke: #8a2d2d; stroke-width: 2; }
  .annotation-label { fill: #8a2d2d; }
  a:hover .annotation-label { fill: #1e3a8a; }</style>
  </defs>
  <rect class="background" width="1040" height="850"/>
  <a class="class-node" data-classifier="Classifier" href="../../index.html#/classifier/classifier" target="_top" aria-label="Classifier — открыть описание класса"><title>Classifier. Представляет классификацию экземпляров по их Features.</title>
<rect class="class-box" x="90" y="35" width="150" height="45"/>
<text class="class-name abstract" x="165.0" y="58" text-anchor="middle">Classifier</text>
</a>
<a class="class-node" data-classifier="DataType" href="../../index.html#/classifier/datatype" target="_top" aria-label="DataType — открыть описание класса"><title>DataType. Тип, экземпляры которого идентифицируются только своим значением.</title>
<rect class="class-box" x="60" y="190" width="170" height="160"/>
<text class="class-name" x="145.0" y="213" text-anchor="middle">DataType</text>
</a>
<a class="class-node" data-classifier="Property" href="../../index.html#/classifier/property" target="_top" aria-label="Property — открыть описание класса"><title>Property. StructuralFeature. Property, связанная отношением ownedAttribute с классификатором (кроме ассоциации), представляет атрибут и может также представлять конец ассоциации; она связывает экземпляр классификатора со значением или множеством значений типа атрибута. Property, связанная отношением memberEnd с Association, представляет конец ассоциации; тип Property — тип конца ассоциации. Property может выступать DeploymentTarget в отношении Deployment, что позволяет моделировать развёртывание на иерархических узлах со свойствами в роли внутренних частей. Property специализирует ParameterableElement, чтобы свойство можно было представить как формальный параметр шаблона и указать как фактический параметр при привязке шаблона.</title>
<rect class="class-box" x="770" y="180" width="130" height="55"/>
<text class="class-name" x="835.0" y="203" text-anchor="middle">Property</text>
</a>
<a class="class-node" data-classifier="Operation" href="../../index.html#/classifier/operation" target="_top" aria-label="Operation — открыть описание класса"><title>Operation. BehavioralFeature классификатора, специфицирующая имя, тип, параметры и ограничения для вызова связанного поведения. Операция может вызывать исполнение методов-поведений, а также другие поведенческие отклики. Operation специализирует TemplateableElement, чтобы поддерживать спецификацию шаблонных и связанных операций. Operation специализирует ParameterableElement, чтобы операцию можно было представить как формальный параметр шаблона и указать как фактический параметр при привязке шаблона.</title>
<rect class="class-box" x="770" y="317" width="140" height="55"/>
<text class="class-name" x="840.0" y="340" text-anchor="middle">Operation</text>
</a>
<a class="class-node" data-classifier="PrimitiveType" href="../../index.html#/classifier/primitivetype" target="_top" aria-label="PrimitiveType — открыть описание класса"><title>PrimitiveType. Задаёт предопределённый тип данных без какой-либо подструктуры. PrimitiveType может иметь алгебру и операции, определённые вне UML, например математически.</title>
<rect class="class-box" x="60" y="620" width="160" height="55"/>
<text class="class-name" x="140.0" y="643" text-anchor="middle">PrimitiveType</text>
</a>
<a class="class-node" data-classifier="Enumeration" href="../../index.html#/classifier/enumeration" target="_top" aria-label="Enumeration — открыть описание класса"><title>Enumeration. Тип данных, значения которого перечислены в модели как литералы перечисления (EnumerationLiterals).</title>
<rect class="class-box" x="390" y="595" width="160" height="140"/>
<text class="class-name" x="470.0" y="618" text-anchor="middle">Enumeration</text>
</a>
<a class="class-node" data-classifier="InstanceSpecification" href="../../index.html#/classifier/instancespecification" target="_top" aria-label="InstanceSpecification — открыть описание класса"><title>InstanceSpecification. Элемент модели, представляющий экземпляр в моделируемой системе. InstanceSpecification может выступать DeploymentTarget в отношении Deployment, если представляет экземпляр Node. Он может также выступать DeployedArtifact, если представляет экземпляр Artifact.</title>
<rect class="class-box" x="740" y="420" width="240" height="55"/>
<text class="class-name" x="860.0" y="443" text-anchor="middle">InstanceSpecification</text>
</a>
<a class="class-node" data-classifier="EnumerationLiteral" href="../../index.html#/classifier/enumerationliteral" target="_top" aria-label="EnumerationLiteral — открыть описание класса"><title>EnumerationLiteral. Пользовательское значение данных для перечисления.</title>
<rect class="class-box" x="800" y="555" width="220" height="180"/>
<text class="class-name" x="910.0" y="578" text-anchor="middle">EnumerationLiteral</text>
</a>
<path class="generalization-line" d="M 165 190 V 80" data-child="DataType" data-parent="Classifier" marker-end="url(#generalization)"/>
<path class="generalization-line" d="M 140 620 V 520 H 155 V 350" data-child="PrimitiveType" data-parent="DataType" marker-end="url(#generalization)"/>
<path class="generalization-line" d="M 470 595 V 520 H 180 V 350" data-child="Enumeration" data-parent="DataType" marker-end="url(#generalization)"/>
<path class="generalization-line" d="M 870 555 V 475" data-child="EnumerationLiteral" data-parent="InstanceSpecification" marker-end="url(#generalization)"/>
<a class="association-link" href="../../index.html#/association/a-ownedattribute-datatype" target="_top" aria-label="Открыть описание ассоциации A_ownedAttribute_datatype">
<g class="association-group" id="A_ownedAttribute_datatype"><title>Связывает атрибуты DataType с владеющим ими типом данных.</title>
<path class="association" d="M 230 207 H 770"/><path class="association-hitbox" d="M 230 207 H 770" aria-hidden="true"/>
<circle class="end-dot" cx="230" cy="207" r="3"/><polygon class="composition" points="236,207 244,199 252,207 244,215"/><circle class="end-dot" cx="770" cy="207" r="3"/>
<text class="association-end" x="250" y="187"><title>datatype. Связывает атрибуты DataType с владеющим ими типом данных.</title>+ datatype</text>
<text class="association-end" x="750" y="187" text-anchor="end"><title>ownedAttribute. Связывает атрибуты DataType с владеющим ими типом данных.</title>+ ownedAttribute</text>
<text class="association-label" x="250" y="151">{subsets namespace,</text>
<text class="association-label" x="250" y="167">subsets classifier}</text>
<text class="association-label" x="250" y="245">0..1</text>
<text class="association-label" x="750" y="151" text-anchor="end">{ordered, subsets attribute,</text>
<text class="association-label" x="750" y="167" text-anchor="end">subsets ownedMember}</text>
<text class="association-label" x="750" y="245" text-anchor="end">*</text>
</g></a>
<a class="association-link" href="../../index.html#/association/a-ownedoperation-datatype" target="_top" aria-label="Открыть описание ассоциации A_ownedOperation_datatype">
<g class="association-group" id="A_ownedOperation_datatype"><title>Связывает операции DataType с владеющим ими типом данных.</title>
<path class="association" d="M 230 345 H 770"/><path class="association-hitbox" d="M 230 345 H 770" aria-hidden="true"/>
<circle class="end-dot" cx="230" cy="345" r="3"/><polygon class="composition" points="236,345 244,337 252,345 244,353"/><circle class="end-dot" cx="770" cy="345" r="3"/>
<text class="association-end" x="250" y="325"><title>datatype. Связывает операции DataType с владеющим ими типом данных.</title>+ datatype</text>
<text class="association-end" x="750" y="325" text-anchor="end"><title>ownedOperation. Связывает операции DataType с владеющим ими типом данных.</title>+ ownedOperation</text>
<text class="association-label" x="250" y="273">{subsets featuringClassifier,</text>
<text class="association-label" x="250" y="289">subsets namespace, subsets</text>
<text class="association-label" x="250" y="305">redefinitionContext}</text>
<text class="association-label" x="250" y="383">0..1</text>
<text class="association-label" x="750" y="273" text-anchor="end">{ordered, subsets feature, subsets</text>
<text class="association-label" x="750" y="289" text-anchor="end">redefinableElement, subsets</text>
<text class="association-label" x="750" y="305" text-anchor="end">ownedMember}</text>
<text class="association-label" x="750" y="383" text-anchor="end">*</text>
</g></a>
<a class="association-link" href="../../index.html#/association/a-ownedliteral-enumeration" target="_top" aria-label="Открыть описание ассоциации A_ownedLiteral_enumeration">
<g class="association-group" id="A_ownedLiteral_enumeration"><title>Связывает литералы Enumeration с владеющим ими перечислением.</title>
<path class="association" d="M 550 630 H 800"/><path class="association-hitbox" d="M 550 630 H 800" aria-hidden="true"/>
<circle class="end-dot" cx="550" cy="630" r="3"/><polygon class="composition" points="554,630 562,622 570,630 562,638"/><circle class="end-dot" cx="800" cy="630" r="3"/>
<text class="association-end" x="570" y="603"><title>Перечисление, членом которого является этот литерал перечисления.</title>+ enumeration</text>
<text class="association-end" x="780" y="621" text-anchor="end"><title>Упорядоченное множество литералов, принадлежащих этому перечислению.</title>+ ownedLiteral</text>
<text class="association-label" x="570" y="573">{subsets namespace}</text>
<text class="association-label" x="570" y="677">1</text>
<text class="association-label" x="780" y="557" text-anchor="end">{ordered, subsets</text>
<text class="association-label" x="780" y="589" text-anchor="end">ownedMember}</text>
<text class="association-label" x="780" y="677" text-anchor="end">*</text>
</g></a>
<a class="association-link" href="../../index.html#/association/a-classifier-enumerationliteral" target="_top" aria-label="Открыть описание ассоциации A_classifier_enumerationLiteral">
<g class="association-group" id="A_classifier_enumerationLiteral"><title>Связывает литерал перечисления с его классификатором — Enumeration; специализация A_classifier_instanceSpecification.</title>
<path class="association" d="M 550 720 H 800" marker-start="url(#navigation-start)"/><path class="association-hitbox" d="M 550 720 H 800" aria-hidden="true"/>
<circle class="end-dot" cx="550" cy="720" r="3"/>
<text class="association-end" x="570" y="747"><title>Классификатор литерала перечисления; выводится как равный его перечислению.</title>+ /classifier</text>
<text class="association-end" x="780" y="765" text-anchor="end"><title>Литералы, классификатором которых является это перечисление.</title>+ enumerationLiteral</text>
<text class="association-label" x="570" y="693">1</text>
<text class="association-label" x="570" y="789">{readOnly, redefines</text>
<text class="association-label" x="570" y="805">classifier}</text>
<text class="association-label" x="780" y="805" text-anchor="end">{redefines</text>
<text class="association-label" x="780" y="821" text-anchor="end">instanceSpecification}</text>
<text class="association-label" x="780" y="693" text-anchor="end">*</text>
</g></a>
</svg>
