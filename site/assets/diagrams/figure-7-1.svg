    <circle class="end-dot" cx="770" cy="476" r="3"/>
    <circle class="end-dot" cx="698" cy="467" r="3"/>
    <circle class="end-dot" cx="465" cy="303" r="3"/>
    <circle class="end-dot" cx="343" cy="103" r="3"/>
    <circle class="end-dot" cx="343" cy="199" r="3"/>
    <circle class="end-dot" cx="343" cy="285" r="3"/>
    <circle class="end-dot" cx="368" cy="490" r="3"/>
    <path class="composition" d="M 479 177 L 487 183 L 479 189 L 471 183 Z"/>
    <path class="composition" d="M 479 253 L 487 259 L 479 265 L 471 259 Z"/>
