<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="990" height="778" viewBox="0 0 990 778" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Рисунок 7.1 — корневые понятия UML</title>
  <desc id="diagram-description">Метаклассы Element, Relationship, DirectedRelationship и Comment, их обобщения и ассоциации. Классы и ассоциации являются ссылками на страницы справочника. При наведении показываются определения классов и описания концов ассоциаций, а линия ассоциации, её окончания и подписи подсвечиваются.</desc>
  <defs>
    <marker id="generalization" markerWidth="15" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 8 L 1 15 Z" fill="#ffffff" stroke="#111111" stroke-width="1.4"/>
    </marker>
    <marker id="navigation" markerWidth="9" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.2"/>
    </marker>
    <marker id="navigation-start" markerWidth="9" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.2"/>
    </marker>
    <style>
      .background, .class-box { fill: #ffffff; }
      .class-box, .association, .generalization-line, .class-divider { stroke: #111111; stroke-width: 1.4; }
      .association, .generalization-line { fill: none; }
      .class-divider { stroke-width: 1; }
      text { fill: #111111; font-family: Arial, Helvetica, sans-serif; font-size: 16px; }
      .class-name { font-weight: 700; }
      .abstract { font-style: italic; }
      .association-group text { font-size: 14px; }
      .end-dot, .composition { fill: #111111; }
      a { cursor: pointer; }
      a:hover .class-box { fill: #eef3fb; stroke: #1e3a8a; }
      a:focus-visible { outline: none; }
      a:focus-visible .class-box { stroke: #7c3aed; stroke-width: 3; }
      .association { pointer-events: stroke; }
      .association-hitbox { fill: none; stroke: transparent; stroke-width: 10; pointer-events: stroke; }
      .association-group:hover .association { stroke: #1e3a8a; stroke-width: 2.2; }
      .association-group:hover text { fill: #1e3a8a; }
      .association-group:hover .end-dot, .association-group:hover .composition { fill: #1e3a8a; }
      .association-end { cursor: help; }
    </style>
  </defs>

  <rect class="background" width="990" height="778"/>

  <a href="../../index.html#/classifier/element" target="_top" aria-label="Element — открыть описание класса">
    <title>Element. Составная часть модели, способная владеть другими элементами.</title>
    <rect class="class-box" x="343" y="97" width="136" height="207"/>
    <line class="class-divider" x1="343" y1="121" x2="479" y2="121"/>
    <text class="class-name abstract" x="411" y="115" text-anchor="middle">Element</text>
  </a>

  <a href="../../index.html#/classifier/relationship" target="_top" aria-label="Relationship — открыть описание класса">
    <title>Relationship. Абстрактное понятие, задающее некоторый вид отношения между элементами.</title>
    <rect class="class-box" x="368" y="470" width="157" height="40"/>
    <line class="class-divider" x1="368" y1="497" x2="525" y2="497"/>
    <text class="class-name abstract" x="446.5" y="493" text-anchor="middle">Relationship</text>
  </a>

  <a href="../../index.html#/classifier/directedrelationship" target="_top" aria-label="DirectedRelationship — открыть описание класса">
    <title>DirectedRelationship. Отношение между множеством исходных элементов модели и множеством целевых элементов модели.</title>
    <rect class="class-box" x="368" y="643" width="216" height="107"/>
    <line class="class-divider" x1="368" y1="668" x2="584" y2="668"/>
    <text class="class-name abstract" x="476" y="663" text-anchor="middle">DirectedRelationship</text>
  </a>

  <a href="../../index.html#/classifier/comment" target="_top" aria-label="Comment — открыть описание класса">
    <title>Comment. Текстовая аннотация, которую можно присоединить к множеству элементов.</title>
    <rect class="class-box" x="612" y="467" width="158" height="52"/>
    <line class="class-divider" x1="612" y1="493" x2="770" y2="493"/>
    <text class="class-name" x="691" y="486" text-anchor="middle">Comment</text>
    <text x="618" y="510">+ body : String [0..1]</text>
  </a>

  <g aria-label="Обобщения">
    <path class="generalization-line" d="M 446 470 V 400 H 424 V 304" marker-end="url(#generalization)"/>
    <path class="generalization-line" d="M 698 467 V 400 H 424"/>
    <path class="generalization-line" d="M 476 643 V 510" marker-end="url(#generalization)"/>
  </g>

  <a class="association-link" href="../../index.html#/association/a-source-directedrelationship" target="_top" aria-label="Открыть описание ассоциации source — directedRelationship">
  <g class="association-group" id="A_source_directedRelationship" aria-label="Ассоциация source — directedRelationship">
    <path class="association" d="M 343 103 H 51 V 658 H 368" marker-start="url(#navigation-start)" marker-end="url(#navigation)"/>
    <path class="association-hitbox" d="M 343 103 H 51 V 658 H 368" aria-hidden="true"/>
    <circle class="end-dot" cx="343" cy="103" r="3"/>
    <text x="335" y="60" text-anchor="end">{readOnly, union, subsets</text>
    <text x="335" y="76" text-anchor="end">relatedElement}</text>
    <text class="association-end" x="335" y="92" text-anchor="end"><title>Исходные элементы направленного отношения.</title>+ /source</text>
    <text x="335" y="126" text-anchor="end">1..*</text>
    <text x="360" y="588" text-anchor="end">{readOnly, union,</text>
    <text x="360" y="604" text-anchor="end">subsets relationship}</text>
    <text class="association-end" x="360" y="620" text-anchor="end"><title>Направленные отношения, для которых элемент является источником.</title>+ /directedRelationship</text>
    <text x="360" y="636" text-anchor="end">*</text>
  </g>
  </a>

  <a class="association-link" href="../../index.html#/association/a-target-directedrelationship" target="_top" aria-label="Открыть описание ассоциации target — directedRelationship">
  <g class="association-group" id="A_target_directedRelationship" aria-label="Ассоциация target — directedRelationship">
    <path class="association" d="M 343 199 H 121 V 742 H 368" marker-start="url(#navigation-start)" marker-end="url(#navigation)"/>
    <path class="association-hitbox" d="M 343 199 H 121 V 742 H 368" aria-hidden="true"/>
    <circle class="end-dot" cx="343" cy="199" r="3"/>
    <text x="335" y="156" text-anchor="end">{readOnly, union, subsets</text>
    <text x="335" y="172" text-anchor="end">relatedElement}</text>
    <text class="association-end" x="335" y="188" text-anchor="end"><title>Целевые элементы направленного отношения.</title>+ /target</text>
    <text x="335" y="222" text-anchor="end">1..*</text>
    <text x="360" y="699" text-anchor="end">{readOnly, union,</text>
    <text x="360" y="715" text-anchor="end">subsets relationship}</text>
    <text class="association-end" x="360" y="731" text-anchor="end"><title>Направленные отношения, для которых элемент является целью.</title>+ /directedRelationship</text>
    <text x="360" y="766" text-anchor="end">*</text>
  </g>
  </a>

  <a class="association-link" href="../../index.html#/association/a-relatedelement-relationship" target="_top" aria-label="Открыть описание ассоциации relatedElement — relationship">
  <g class="association-group" id="A_relatedElement_relationship" aria-label="Ассоциация relatedElement — relationship">
    <path class="association" d="M 343 285 H 168 V 490 H 368" marker-start="url(#navigation-start)"/>
    <path class="association-hitbox" d="M 343 285 H 168 V 490 H 368" aria-hidden="true"/>
    <circle class="end-dot" cx="343" cy="285" r="3"/>
    <circle class="end-dot" cx="368" cy="490" r="3"/>
    <text x="335" y="258" text-anchor="end">{readOnly, union}</text>
    <text class="association-end" x="335" y="274" text-anchor="end"><title>Элементы, связанные этим отношением.</title>+ /relatedElement</text>
    <text x="335" y="308" text-anchor="end">1..*</text>
    <text x="360" y="464" text-anchor="end">{readOnly, union}</text>
    <text class="association-end" x="360" y="480" text-anchor="end"><title>Отношения, в которых участвует элемент.</title>+ /relationship</text>
    <text x="360" y="512" text-anchor="end">*</text>
  </g>
  </a>

  <a class="association-link" href="../../index.html#/association/a-annotatedelement-comment" target="_top" aria-label="Открыть описание ассоциации annotatedElement — comment">
  <g class="association-group" id="A_annotatedElement_comment" aria-label="Ассоциация annotatedElement — comment">
    <path class="association" d="M 479 103 H 933 V 476 H 770" marker-start="url(#navigation-start)"/>
    <path class="association-hitbox" d="M 479 103 H 933 V 476 H 770" aria-hidden="true"/>
    <circle class="end-dot" cx="479" cy="103" r="3"/>
    <circle class="end-dot" cx="770" cy="476" r="3"/>
    <text class="association-end" x="487" y="92"><title>Элементы, к которым относится комментарий.</title>+ annotatedElement</text>
    <text x="487" y="127">*</text>
    <text class="association-end" x="778" y="466"><title>Комментарии, присоединённые к элементу.</title>+ comment</text>
    <text x="778" y="498">*</text>
  </g>
  </a>

  <a class="association-link" href="../../index.html#/association/a-ownedcomment-owningelement" target="_top" aria-label="Открыть описание ассоциации ownedComment — owningElement">
  <g class="association-group" id="A_ownedComment_owningElement" aria-label="Ассоциация ownedComment — owningElement">
    <path class="association" d="M 479 183 H 698 V 467" marker-end="url(#navigation)"/>
    <path class="association-hitbox" d="M 479 183 H 698 V 467" aria-hidden="true"/>
    <path class="composition" d="M 487 177 L 495 183 L 487 189 L 479 183 Z"/>
    <circle class="end-dot" cx="698" cy="467" r="3"/>
    <text x="487" y="154">{subsets owner}</text>
    <text class="association-end" x="487" y="170"><title>Элемент, владеющий комментарием.</title>+ owningElement</text>
    <text x="487" y="208">0..1</text>
    <text x="706" y="456">*</text>
    <text x="686" y="440" text-anchor="end">{subsets ownedElement}</text>
    <text class="association-end" x="686" y="456" text-anchor="end"><title>Комментарии, принадлежащие элементу.</title>+ ownedComment</text>
  </g>
  </a>

  <a class="association-link" href="../../index.html#/association/a-ownedelement-owner" target="_top" aria-label="Открыть описание ассоциации owner — ownedElement">
  <g class="association-group" id="A_ownedElement_owner" aria-label="Ассоциация owner — ownedElement">
    <path class="association" d="M 479 259 H 622 V 364 H 465 V 304" marker-end="url(#navigation)"/>
    <path class="association-hitbox" d="M 479 259 H 622 V 364 H 465 V 304" aria-hidden="true"/>
    <path class="composition" d="M 487 253 L 495 259 L 487 265 L 479 259 Z"/>
    <circle class="end-dot" cx="465" cy="304" r="3"/>
    <text x="487" y="230">{readOnly, union}</text>
    <text class="association-end" x="487" y="246"><title>Элемент-владелец.</title>+ /owner</text>
    <text x="487" y="286">0..1</text>
    <text x="457" y="326" text-anchor="end">*</text>
    <text class="association-end" x="475" y="326"><title>Элементы, принадлежащие данному элементу.</title>+ /ownedElement</text>
    <text x="475" y="342">{readOnly, union}</text>
  </g>
  </a>
</svg>
