<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="430" viewBox="0 0 1250 430" role="img" aria-labelledby="diagram-title diagram-description" data-figure="7.13">
  <title id="diagram-title">Рисунок 7.13 — Абстрактный синтаксис ограничений</title>
  <desc id="diagram-description">Метакласс Constraint, его контекст, ограничиваемые элементы и спецификация.</desc>
  <defs>
    <marker id="generalization" markerWidth="15" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 13 8 L 1 15 Z" fill="#ffffff" stroke="#111111" stroke-width="1.4"/></marker>
    <marker id="navigation" markerWidth="9" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker>
    <marker id="navigation-start" markerWidth="9" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker>
    <style>.background, .class-box, .package-box, .note-box { fill: #ffffff; }
  .class-box, .package-box, .note-box, .association, .generalization-line,
  .class-divider, .example-association, .dependency-line, .note-link { stroke: #111111; stroke-width: 1.4; }
  .association, .generalization-line, .class-divider, .example-association,
  .dependency-line, .note-link { fill: none; }
  .class-divider { stroke-width: 1; }
  text { fill: #111111; font-family: Arial, Helvetica, sans-serif; font-size: 16px; }
  .class-name { font-weight: 700; }
  .abstract { font-style: italic; }
  .attribute, .operation { font-size: 14px; }
  .association-end, .association-label, .example-association-group .example-label { font-size: 14px; }
  .end-dot, .composition { fill: #111111; }
  .dependency-line, .note-link { stroke-dasharray: 7 5; }
  .template-signature { stroke-dasharray: 4 3; }
  a { cursor: pointer; }
  a:hover .class-box, a:hover .note-box { fill: #eef3fb; stroke: #1e3a8a; }
  a:focus-visible { outline: none; }
  a:focus-visible .class-box, a:focus-visible .note-box { stroke: #7c3aed; stroke-width: 3; }
  .association, .example-association, .dependency-line { pointer-events: stroke; }
  .association-hitbox { fill: none; stroke: transparent; stroke-width: 12; pointer-events: stroke; }
  .association-group:hover .association, .example-association-group:hover .example-association,
  .dependency-group:hover .dependency-line { stroke: #1e3a8a; stroke-width: 2.2; }
  .association-group:hover text, .example-association-group:hover text,
  .dependency-group:hover text { fill: #1e3a8a; }
  .association-group:hover .end-dot, .association-group:hover .composition,
  .example-association-group:hover .end-dot { fill: #1e3a8a; }
  .association-end { cursor: help; }</style>
  </defs>
  <rect class="background" width="1250" height="430"/>
  <a class="class-node" data-classifier="PackageableElement" href="../../index.html#/classifier/packageableelement" target="_top" aria-label="PackageableElement — открыть описание класса"><title>PackageableElement. NamedElement, который может непосредственно принадлежать пакету и выступать parameteredElement для TemplateParameter.</title>
<rect class="class-box" x="560" y="30" width="200" height="50"/>
<line class="class-divider" x1="560" y1="62" x2="760" y2="62"/>
<text class="class-name abstract" x="660.0" y="53" text-anchor="middle">PackageableElement</text>
</a>
<a class="class-node" data-classifier="Constraint" href="../../index.html#/classifier/constraint" target="_top" aria-label="Constraint — открыть описание класса"><title>Constraint. Условие или ограничение, записанное на естественном или машинно-читаемом языке и объявляющее часть семантики элемента или множества элементов.</title>
<rect class="class-box" x="520" y="130" width="240" height="190"/>
<line class="class-divider" x1="520" y1="162" x2="760" y2="162"/>
<text class="class-name" x="640.0" y="153" text-anchor="middle">Constraint</text>
</a>
<a class="class-node" data-classifier="Namespace" href="../../index.html#/classifier/namespace" target="_top" aria-label="Namespace — открыть описание класса"><title>Namespace. Элемент модели, который владеет именованными элементами и/или импортирует их, обеспечивая идентификацию по имени.</title>
<rect class="class-box" x="40" y="190" width="150" height="55"/>
<line class="class-divider" x1="40" y1="222" x2="190" y2="222"/>
<text class="class-name abstract" x="115.0" y="213" text-anchor="middle">Namespace</text>
</a>
<a class="class-node" data-classifier="Element" href="../../index.html#/classifier/element" target="_top" aria-label="Element — открыть описание класса"><title>Element. Составная часть модели, способная владеть другими элементами.</title>
<rect class="class-box" x="960" y="115" width="140" height="55"/>
<line class="class-divider" x1="960" y1="147" x2="1100" y2="147"/>
<text class="class-name abstract" x="1030.0" y="138" text-anchor="middle">Element</text>
</a>
<a class="class-node" data-classifier="ValueSpecification" href="../../index.html#/classifier/valuespecification" target="_top" aria-label="ValueSpecification — открыть описание класса"><title>ValueSpecification. Спецификация возможно пустого множества значений; ParameterableElement, который может выступать формальным параметром шаблона или фактическим параметром при его привязке.</title>
<rect class="class-box" x="1000" y="280" width="230" height="65"/>
<line class="class-divider" x1="1000" y1="312" x2="1230" y2="312"/>
<text class="class-name abstract" x="1115.0" y="303" text-anchor="middle">ValueSpecification</text>
</a>
<path class="generalization-line" d="M 640 130 V 80" data-child="Constraint" data-parent="PackageableElement" marker-end="url(#generalization)"/>
<a class="association-link" href="../../index.html#/association/a-constrainedelement-constraint" target="_top" aria-label="Открыть описание ассоциации A_constrainedElement_constraint">
<g class="association-group" id="A_constrainedElement_constraint"><title>Связывает constrainedElement с применяемыми Constraints.</title>
<path class="association" d="M 760 155 H 960" marker-end="url(#navigation)"/><path class="association-hitbox" d="M 760 155 H 960" aria-hidden="true"/>
<circle class="end-dot" cx="760" cy="155" r="3"/>
<text class="association-end" x="772" y="140"><title>constraint. Связывает constrainedElement с применяемыми Constraints.</title>+ constraint</text>
<text class="association-end" x="948" y="115" text-anchor="end"><title>Упорядоченное множество элементов, к которым применяется ограничение.</title>+ constrainedElement</text>
<text class="association-label" x="772" y="185">*</text>
<text class="association-label" x="948" y="99" text-anchor="end">{ordered}</text>
<text class="association-label" x="948" y="185" text-anchor="end">*</text>
</g></a>
<a class="association-link" href="../../index.html#/association/a-ownedrule-context" target="_top" aria-label="Открыть описание ассоциации A_ownedRule_context">
<g class="association-group" id="A_ownedRule_context"><title>Связывает Namespace с принадлежащими ему Constraints и их контекстом.</title>
<path class="association" d="M 190 225 H 520"/><path class="association-hitbox" d="M 190 225 H 520" aria-hidden="true"/>
<polygon class="composition" points="190,225 198,217 206,225 198,233"/><circle class="end-dot" cx="520" cy="225" r="3"/>
<text class="association-end" x="202" y="210"><title>Пространство имён, владеющее ограничением.</title>+ context</text>
<text class="association-end" x="508" y="210" text-anchor="end"><title>Ограничения, принадлежащие пространству имён.</title>+ ownedRule</text>
<text class="association-label" x="202" y="194">{subsets namespace}</text>
<text class="association-label" x="202" y="255">0..1</text>
<text class="association-label" x="508" y="194" text-anchor="end">{subsets ownedMember}</text>
<text class="association-label" x="508" y="249" text-anchor="end">*</text>
</g></a>
<a class="association-link" href="../../index.html#/association/a-specification-owningconstraint" target="_top" aria-label="Открыть описание ассоциации A_specification_owningConstraint">
<g class="association-group" id="A_specification_owningConstraint"><title>Связывает ValueSpecification с Constraint, которому принадлежит условие.</title>
<path class="association" d="M 760 285 H 1000" marker-end="url(#navigation)"/><path class="association-hitbox" d="M 760 285 H 1000" aria-hidden="true"/>
<polygon class="composition" points="760,285 768,277 776,285 768,293"/>
<text class="association-end" x="772" y="270"><title>owningConstraint. Связывает ValueSpecification с Constraint, которому принадлежит условие.</title>+ owningConstraint</text>
<text class="association-end" x="990" y="245" text-anchor="end"><title>Условие, которое должно быть истинным для выполнения ограничения.</title>+ specification</text>
<text class="association-label" x="772" y="254">{subsets owner}</text>
<text class="association-label" x="772" y="315">0..1</text>
<text class="association-label" x="990" y="350" text-anchor="end">{subsets ownedElement}</text>
<text class="association-label" x="970" y="366" text-anchor="end">1</text>
</g></a>
</svg>
