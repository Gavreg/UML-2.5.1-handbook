<circle class="end-dot" cx="270" cy="435" r="3"/><polygon class="composition" points="570,435 562,427 554,435 562,443"/>
<text class="association-end" x="282" y="420"><title>Необязательное выражение, уточняющее отношение между поставщиками и клиентами.</title>+ mapping</text>
<text class="association-end" x="550" y="415" text-anchor="end"><title>abstraction. Связывает OpaqueExpression отображения с владеющим Abstraction.</title>+ abstraction</text>
<text class="association-label" x="282" y="404">{subsets ownedElement}</text>
<text class="association-label" x="282" y="467">0..1</text>
<text class="association-label" x="550" y="399" text-anchor="end">{subsets owner}</text>
<text class="association-label" x="550" y="467" text-anchor="end">0..1</text>
</g></a>
