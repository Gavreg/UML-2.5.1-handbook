<a class="association-link" href="../../index.html#/association/a-supplier-supplierdependency" target="_top" aria-label="Открыть описание ассоциации A_supplier_supplierDependency">
<g class="association-group" id="A_supplier_supplierDependency"><title>Связывает NamedElement-поставщика с Dependencies, которые на него ссылаются.</title>
<path class="association" d="M 270 185 H 600" marker-start="url(#navigation-start)"/><path class="association-hitbox" d="M 270 185 H 600" aria-hidden="true"/>
<circle class="end-dot" cx="270" cy="185" r="3"/><circle class="end-dot" cx="600" cy="185" r="3"/>
<text class="association-end" x="282" y="170"><title>Элементы, от которых зависят клиенты.</title>+ supplier</text>
<text class="association-end" x="588" y="170" text-anchor="end"><title>supplierDependency. Связывает NamedElement-поставщика с Dependencies, которые на него ссылаются.</title>+ supplierDependency</text>
<text class="association-label" x="282" y="154">{subsets target}</text>
<text class="association-label" x="282" y="209">1..*</text>
<text class="association-label" x="588" y="154" text-anchor="end">{subsets directedRelationship}</text>
<text class="association-label" x="588" y="209" text-anchor="end">*</text>
</g></a>
<a class="association-link" href="../../index.html#/association/a-clientdependency-client" target="_top" aria-label="Открыть описание ассоциации A_clientDependency_client">
<g class="association-group" id="A_clientDependency_client"><title>Связывает NamedElement-клиента с его Dependencies.</title>
<path class="association" d="M 270 260 H 600" marker-start="url(#navigation-start)"/><path class="association-hitbox" d="M 270 260 H 600" aria-hidden="true"/>
<circle class="end-dot" cx="270" cy="260" r="3"/><circle class="end-dot" cx="600" cy="260" r="3"/>
<text class="association-end" x="282" y="245"><title>Элементы, зависящие от поставщиков.</title>+ client</text>
<text class="association-end" x="588" y="245" text-anchor="end"><title>Зависимости, в которых элемент выступает клиентом.</title>+ /clientDependency</text>
<text class="association-label" x="282" y="300">{subsets source}</text>
<text class="association-label" x="282" y="284">1..*</text>
<text class="association-label" x="588" y="229" text-anchor="end">{subsets directedRelationship}</text>
<text class="association-label" x="588" y="284" text-anchor="end">*</text>
</g></a>
<a class="association-link" href="../../index.html#/association/a-mapping-abstraction" target="_top" aria-label="Открыть описание ассоциации A_mapping_abstraction">
<g class="association-group" id="A_mapping_abstraction"><title>Связывает OpaqueExpression отображения с владеющим Abstraction.</title>
