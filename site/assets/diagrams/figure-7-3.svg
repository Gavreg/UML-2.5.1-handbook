<rect class="class-box" x="900" y="500" width="240" height="310"/>
<line class="class-divider" x1="900" y1="532" x2="1140" y2="532"/>
<text class="class-name abstract" x="1020.0" y="523" text-anchor="middle">ParameterableElement</text>
</a>
<a class="class-node" data-classifier="Element" href="../../index.html#/classifier/element" target="_top" aria-label="Element — открыть описание класса"><title>Element. Составная часть модели, способная владеть другими элементами.</title>
<rect class="class-box" x="590" y="865" width="120" height="45"/>
<line class="class-divider" x1="590" y1="897" x2="710" y2="897"/>
<text class="class-name abstract" x="650.0" y="888" text-anchor="middle">Element</text>
