<path class="generalization-line" d="M 230 170 V 100 H 650 V 75" data-child="TemplateSignature" data-parent="Element" marker-end="url(#generalization)"/>
<path class="generalization-line" d="M 1015 170 V 100 H 650"/>
<path class="generalization-line" d="M 230 810 V 845 H 650 V 865" data-child="TemplateParameter" data-parent="Element" marker-end="url(#generalization)"/>
<path class="generalization-line" d="M 1020 810 V 845 H 650"/>
<a class="association-link" href="../../index.html#/association/a-ownedtemplatesignature-template" target="_top" aria-label="Открыть описание ассоциации A_ownedTemplateSignature_template">
<g class="association-group" id="A_ownedTemplateSignature_template"><title>Связывает TemplateableElement с принадлежащей ему TemplateSignature.</title>
<path class="association" d="M 330 195 H 900" marker-start="url(#navigation-start)"/><path class="association-hitbox" d="M 330 195 H 900" aria-hidden="true"/>
<circle class="end-dot" cx="330" cy="195" r="3"/><polygon class="composition" points="900,195 892,187 884,195 892,203"/>
<text class="association-end" x="350" y="175"><title>Элемент-шаблон, владеющий подписью.</title>+ template</text>
<text class="association-end" x="880" y="175" text-anchor="end"><title>Необязательная подпись, делающая элемент шаблоном.</title>+ ownedTemplateSignature</text>
<text class="association-label" x="350" y="150">{subsets owner}</text>
<text class="association-label" x="350" y="225">0..1</text>
<text class="association-label" x="880" y="150" text-anchor="end">{subsets ownedElement}</text>
<text class="association-label" x="880" y="225" text-anchor="end">1</text>
</g></a>
<a class="association-link" href="../../index.html#/association/a-ownedparameter-signature" target="_top" aria-label="Открыть описание ассоциации A_ownedParameter_signature">
<g class="association-group" id="A_ownedParameter_signature"><title>Связывает TemplateSignature с принадлежащими ему TemplateParameters.</title>
<path class="association" d="M 190 230 V 500" marker-end="url(#navigation)"/><path class="association-hitbox" d="M 190 230 V 500" aria-hidden="true"/>
<polygon class="composition" points="190,230 182,238 190,246 198,238"/><circle class="end-dot" cx="190" cy="500" r="3"/>
<text class="association-end" x="170" y="253" text-anchor="end"><title>Подпись, владеющая параметром.</title>+ signature</text>
<text class="association-end" x="160" y="490" text-anchor="end"><title>Формальные параметры, принадлежащие подписи.</title>+ ownedParameter</text>
<text class="association-label" x="178" y="278" text-anchor="end">{subsets templateSignature,</text>
<text class="association-label" x="178" y="298" text-anchor="end">subsets owner}</text>
<text class="association-label" x="178" y="320" text-anchor="end">1</text>
<text class="association-label" x="178" y="445" text-anchor="end">{ordered, subsets ownedElement,</text>
<text class="association-label" x="178" y="465" text-anchor="end">subsets parameter}</text>
<text class="association-label" x="40" y="535" text-anchor="end">1..*</text>
</g></a>
<a class="association-link" href="../../index.html#/association/a-parameter-templatesignature" target="_top" aria-label="Открыть описание ассоциации A_parameter_templateSignature">
<g class="association-group" id="A_parameter_templateSignature"><title>Связывает TemplateParameter с TemplateSignature, к которой он относится.</title>
<path class="association" d="M 275 230 V 500" marker-end="url(#navigation)"/><path class="association-hitbox" d="M 275 230 V 500" aria-hidden="true"/>
<circle class="end-dot" cx="275" cy="230" r="3"/>
<text class="association-end" x="287" y="253"><title>templateSignature. Связывает TemplateParameter с TemplateSignature, к которой он относится.</title>+ templateSignature</text>
<text class="association-end" x="340" y="477"><title>Упорядоченное множество всех формальных параметров.</title>+ parameter</text>
<text class="association-label" x="287" y="278">0..1</text>
<text class="association-label" x="287" y="323">{ordered}</text>
<text class="association-label" x="340" y="460">1..*</text>
</g></a>
<a class="association-link" href="../../index.html#/association/a-ownedparameteredelement-owningtemplateparameter" target="_top" aria-label="Открыть описание ассоциации A_ownedParameteredElement_owningTemplateParameter">
<g class="association-group" id="A_ownedParameteredElement_owningTemplateParameter"><title>Связывает TemplateParameter с принадлежащим ему ParameterableElement.</title>
<path class="association" d="M 330 540 H 900" marker-start="url(#navigation-start)"/><path class="association-hitbox" d="M 330 540 H 900" aria-hidden="true"/>
<circle class="end-dot" cx="330" cy="540" r="3"/><polygon class="composition" points="900,540 892,532 884,540 892,548"/>
<text class="association-end" x="350" y="525"><title>Формальный параметр, владеющий этим элементом.</title>+ owningTemplateParameter</text>
<text class="association-end" x="880" y="515" text-anchor="end"><title>Принадлежащий параметру параметризуемый элемент.</title>+ ownedParameteredElement</text>
<text class="association-label" x="350" y="505">{subsets owner, templateParameter}</text>
<text class="association-label" x="350" y="564">0..1</text>
<text class="association-label" x="880" y="490" text-anchor="end">{subsets ownedElement, parameteredElement}</text>
<text class="association-label" x="880" y="575" text-anchor="end">0..1</text>
</g></a>
<a class="association-link" href="../../index.html#/association/a-parameteredelement-templateparameter" target="_top" aria-label="Открыть описание ассоциации A_parameteredElement_templateParameter">
<g class="association-group" id="A_parameteredElement_templateParameter"><title>Связывает ParameterableElement с представляющим его TemplateParameter.</title>
<path class="association" d="M 330 630 H 900" marker-start="url(#navigation-start)"/><path class="association-hitbox" d="M 330 630 H 900" aria-hidden="true"/>
<circle class="end-dot" cx="330" cy="630" r="3"/><circle class="end-dot" cx="900" cy="630" r="3"/>
<text class="association-end" x="350" y="615"><title>Параметр шаблона, представляющий этот элемент как формальный параметр.</title>+ templateParameter</text>
<text class="association-end" x="880" y="615" text-anchor="end"><title>Элемент, представленный параметром шаблона.</title>+ parameteredElement</text>
<text class="association-label" x="350" y="654">0..1</text>
<text class="association-label" x="880" y="654" text-anchor="end">1</text>
</g></a>
<a class="association-link" href="../../index.html#/association/a-default-templateparameter" target="_top" aria-label="Открыть описание ассоциации A_default_templateParameter">
<g class="association-group" id="A_default_templateParameter"><title>Связывает значение ParameterableElement по умолчанию с TemplateParameter.</title>
<path class="association" d="M 330 700 H 900" marker-end="url(#navigation)"/><path class="association-hitbox" d="M 330 700 H 900" aria-hidden="true"/>
<circle class="end-dot" cx="330" cy="700" r="3"/>
<text class="association-end" x="350" y="685"><title>default. Связывает значение ParameterableElement по умолчанию с TemplateParameter.</title>+ default</text>
<text class="association-end" x="880" y="685" text-anchor="end"><title>templateParameter. Связывает значение ParameterableElement по умолчанию с TemplateParameter.</title>+ templateParameter</text>
<text class="association-label" x="350" y="730">0..1</text>
<text class="association-label" x="880" y="730" text-anchor="end">0..1</text>
</g></a>
<a class="association-link" href="../../index.html#/association/a-owneddefault-templateparameter" target="_top" aria-label="Открыть описание ассоциации A_ownedDefault_templateParameter">
<g class="association-group" id="A_ownedDefault_templateParameter"><title>Специализация A_default_templateParameter для значения, принадлежащего TemplateParameter.</title>
<path class="association" d="M 330 800 H 900" marker-end="url(#navigation)"/><path class="association-hitbox" d="M 330 800 H 900" aria-hidden="true"/>
<polygon class="composition" points="330,800 338,792 346,800 338,808"/>
<text class="association-end" x="350" y="780"><title>ownedDefault. Специализация A_default_templateParameter для значения, принадлежащего TemplateParameter.</title>+ ownedDefault</text>
<text class="association-end" x="880" y="780" text-anchor="end"><title>templateParameter. Специализация A_default_templateParameter для значения, принадлежащего TemplateParameter.</title>+ templateParameter</text>
<text class="association-label" x="350" y="750">{subsets ownedElement, default}</text>
<text class="association-label" x="350" y="835">0..1</text>
<text class="association-label" x="880" y="750" text-anchor="end">{subsets owner, redefines templateParameter}</text>
<text class="association-label" x="880" y="835" text-anchor="end">0..1</text>
</g></a>
</svg>
