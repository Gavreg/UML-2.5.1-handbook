<text class="attribute" x="802" y="50">Resource: StringExpression,</text>
<text class="attribute" x="802" y="74">ResourceKind: StringExpression,</text>
<text class="attribute" x="802" y="98">System</text>
<path class="note-link" d="M 925 130 V 150"/>
