<text class="class-name" x="580.0" y="848" text-anchor="middle">TrainingAdmin</text>
</g>
<a class="dependency-group" href="../../index.html#/classifier/templatebinding" target="_top"><title>Привязка Resource → Instructor, ResourceKind → Qualification, System → TrainingAdminSystem.</title><path class="dependency-line" d="M 520 825 L 275 720" marker-end="url(#navigation)"/><text x="200" y="765" text-anchor="middle">«bind»</text></a>
<text class="example-label" x="100" y="790">Resource -&gt; &quot;Instructor&quot;,</text>
<text class="example-label" x="100" y="812">ResourceKind -&gt; &quot;Qualification&quot;,</text>
<text class="example-label" x="100" y="834">System -&gt; TrainingAdminSystem</text>
<a class="dependency-group" href="../../index.html#/classifier/templatebinding" target="_top"><title>Привязка Resource → Facility, ResourceKind → FacilitySpecification, System → TrainingAdminSystem.</title><path class="dependency-line" d="M 620 825 L 835 720" marker-end="url(#navigation)"/><text x="800" y="765" text-anchor="middle">«bind»</text></a>
<text class="example-label" x="735" y="790">Resource -&gt; &quot;Facility&quot;,</text>
<text class="example-label" x="735" y="812">ResourceKind -&gt; &quot;FacilitySpecification&quot;,</text>
