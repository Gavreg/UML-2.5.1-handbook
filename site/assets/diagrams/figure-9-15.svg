<text class="association-label" x="360" y="345"><title>Имя набора обобщений: все обобщения с этим именем принадлежат одному GeneralizationSet.</title>GeneralizationSet1</text>
<text class="association-label" x="482" y="180"><title>Имя набора обобщений: все обобщения с этим именем принадлежат одному GeneralizationSet.</title>GeneralizationSet2</text>
