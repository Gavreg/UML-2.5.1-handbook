<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-labelledby="diagram-title diagram-description" data-figure="9.2">
  <title id="diagram-title">Рисунок 9.2 — Обозначение обобщения с разными стилями целей</title>
  <desc id="diagram-description">Два стиля обобщений: отдельная цель для каждой стрелки и общая цель для нескольких обобщений (абстрактный класс Shape и классы Polygon, Ellipse, Spline).</desc>
  <defs>
    <marker id="generalization" markerWidth="15" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 13 8 L 1 15 Z" fill="#ffffff" stroke="#111111" stroke-width="1.4"/></marker>
    <marker id="navigation" markerWidth="9" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker>
    <marker id="navigation-start" markerWidth="9" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker>
    <marker id="annotation" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#8a2d2d"/></marker>
    <style>.background, .class-box, .package-box, .note-box { fill: #ffffff; }
  .class-box, .package-box, .note-box, .association, .generalization-line,
  .class-divider, .example-association, .dependency-line, .note-link { stroke: #111111; stroke-width: 1.4; }
  .association, .generalization-line, .class-divider, .example-association,
  .dependency-line, .note-link { fill: none; }
  .class-divider { stroke-width: 1; }
  text { fill: #111111; font-family: Arial, Helvetica, sans-serif; font-size: 16px; }
  .class-name { font-weight: 700; }
  .abstract { font-style: italic; }
  .attribute, .operation { font-size: 14px; }
  .association-end, .association-label, .example-association-group .example-label { font-size: 14px; }
  .end-dot, .composition { fill: #111111; }
  .dependency-line, .note-link { stroke-dasharray: 7 5; }
  .template-signature { stroke-dasharray: 4 3; }
  a { cursor: pointer; }
  a:hover .class-box, a:hover .note-box { fill: #eef3fb; stroke: #1e3a8a; }
  a:focus-visible { outline: none; }
  a:focus-visible .class-box, a:focus-visible .note-box { stroke: #7c3aed; stroke-width: 3; }
  .association, .example-association, .dependency-line { pointer-events: stroke; }
  .association-hitbox { fill: none; stroke: transparent; stroke-width: 12; pointer-events: stroke; }
  .association-group:hover .association, .example-association-group:hover .example-association,
  .dependency-group:hover .dependency-line { stroke: #1e3a8a; stroke-width: 2.2; }
  .association-group:hover text, .example-association-group:hover text,
  .dependency-group:hover text { fill: #1e3a8a; }
  .association-group:hover .end-dot, .association-group:hover .composition,
  .example-association-group:hover .end-dot { fill: #1e3a8a; }
  .association-end { cursor: help; }
  .sequence-frame, .sequence-lifeline, .sequence-message, .sequence-observation, .sequence-constraint { fill: none; stroke: #111111; stroke-width: 1.4; }
  .sequence-lifeline { stroke-dasharray: 7 5; }
  .annotation-line { fill: none; stroke: #8a2d2d; stroke-width: 2; }
  .annotation-label { fill: #8a2d2d; }
  a:hover .annotation-label { fill: #1e3a8a; }</style>
  </defs>
  <rect class="background" width="800" height="560"/>
  <g class="class-node" data-classifier="Shape"><title>Абстрактный пример класса Shape.</title>
<rect class="class-box" x="340" y="30" width="120" height="50"/>
<line class="class-divider" x1="340" y1="62" x2="460" y2="62"/>
<text class="class-name abstract" x="400.0" y="53" text-anchor="middle">Shape</text>
</g>
<g class="class-node" data-classifier="Polygon"><title>Polygon. Пример класса Polygon.</title>
<rect class="class-box" x="60" y="210" width="140" height="60"/>
<line class="class-divider" x1="60" y1="242" x2="200" y2="242"/>
<text class="class-name" x="130.0" y="233" text-anchor="middle">Polygon</text>
</g>
<g class="class-node" data-classifier="Ellipse"><title>Ellipse. Пример класса Ellipse.</title>
<rect class="class-box" x="330" y="210" width="140" height="60"/>
<line class="class-divider" x1="330" y1="242" x2="470" y2="242"/>
<text class="class-name" x="400.0" y="233" text-anchor="middle">Ellipse</text>
</g>
<g class="class-node" data-classifier="Spline"><title>Spline. Пример класса Spline.</title>
<rect class="class-box" x="590" y="210" width="150" height="60"/>
<line class="class-divider" x1="590" y1="242" x2="740" y2="242"/>
<text class="class-name" x="665.0" y="233" text-anchor="middle">Spline</text>
</g>
<path class="generalization-line" d="M 130 210 L 365 80" marker-end="url(#generalization)"/>
<path class="generalization-line" d="M 400 210 L 400 80" marker-end="url(#generalization)"/>
<path class="generalization-line" d="M 665 210 L 435 80" marker-end="url(#generalization)"/>
<text class="example-label" x="490" y="60">Separate target style</text>
<g class="class-node" data-classifier="Shape"><title>Абстрактный пример класса Shape.</title>
<rect class="class-box" x="340" y="320" width="120" height="50"/>
<line class="class-divider" x1="340" y1="352" x2="460" y2="352"/>
<text class="class-name abstract" x="400.0" y="343" text-anchor="middle">Shape</text>
</g>
<path class="generalization-line" d="M 400 370 V 400" marker-end="url(#generalization)"/>
<path class="generalization-line" d="M 130 400 H 665 M 130 400 V 470 M 400 400 V 470 M 665 400 V 470"/>
<g class="class-node" data-classifier="Polygon"><title>Polygon. Пример класса Polygon.</title>
<rect class="class-box" x="60" y="470" width="140" height="60"/>
<line class="class-divider" x1="60" y1="502" x2="200" y2="502"/>
<text class="class-name" x="130.0" y="493" text-anchor="middle">Polygon</text>
</g>
<g class="class-node" data-classifier="Ellipse"><title>Ellipse. Пример класса Ellipse.</title>
<rect class="class-box" x="330" y="470" width="140" height="60"/>
<line class="class-divider" x1="330" y1="502" x2="470" y2="502"/>
<text class="class-name" x="400.0" y="493" text-anchor="middle">Ellipse</text>
</g>
<g class="class-node" data-classifier="Spline"><title>Spline. Пример класса Spline.</title>
<rect class="class-box" x="590" y="470" width="150" height="60"/>
<line class="class-divider" x1="590" y1="502" x2="740" y2="502"/>
<text class="class-name" x="665.0" y="493" text-anchor="middle">Spline</text>
</g>
<text class="example-label" x="490" y="350">Shared target style</text>
</svg>
