<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" role="img" aria-labelledby="diagram-title diagram-description" data-figure="9.24">
  <title id="diagram-title">Рисунок 9.24 — Пример типа-степени</title>
  <desc id="diagram-description">Tree и его виды Sugar Maple, Apricot, American Elm и Saguaro; Tree Species — тип-степень набора обобщений ({disjoint, incomplete} : TreeSpecies); связи с Geographic Location и Leaf Pattern.</desc>
  <defs>
    <marker id="generalization" markerWidth="15" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 13 8 L 1 15 Z" fill="#ffffff" stroke="#111111" stroke-width="1.4"/></marker>
    <marker id="navigation" markerWidth="9" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker>
    <marker id="navigation-start" markerWidth="9" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker>
    <marker id="annotation" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#8a2d2d"/></marker>
    <style>.background, .class-box, .package-box, .note-box { fill: #ffffff; }
  .class-box, .package-box, .note-box, .association, .generalization-line,
  .class-divider, .example-association, .dependency-line, .note-link { stroke: #111111; stroke-width: 1.4; }
  .association, .generalization-line, .class-divider, .example-association,
  .dependency-line, .note-link { fill: none; }
  .class-divider { stroke-width: 1; }
  text { fill: #111111; font-family: Arial, Helvetica, sans-serif; font-size: 16px; }
  .class-name { font-weight: 700; }
  .abstract { font-style: italic; }
  .attribute, .operation { font-size: 14px; }
  .association-end, .association-label, .example-association-group .example-label { font-size: 14px; }
  .end-dot, .composition { fill: #111111; }
  .dependency-line, .note-link { stroke-dasharray: 7 5; }
  .template-signature { stroke-dasharray: 4 3; }
  a { cursor: pointer; }
  a:hover .class-box, a:hover .note-box { fill: #eef3fb; stroke: #1e3a8a; }
  a:focus-visible { outline: none; }
  a:focus-visible .class-box, a:focus-visible .note-box { stroke: #7c3aed; stroke-width: 3; }
  .association, .example-association, .dependency-line { pointer-events: stroke; }
  .association-hitbox { fill: none; stroke: transparent; stroke-width: 12; pointer-events: stroke; }
  .association-group:hover .association, .example-association-group:hover .example-association,
  .dependency-group:hover .dependency-line { stroke: #1e3a8a; stroke-width: 2.2; }
  .association-group:hover text, .example-association-group:hover text,
  .dependency-group:hover text { fill: #1e3a8a; }
  .association-group:hover .end-dot, .association-group:hover .composition,
  .example-association-group:hover .end-dot { fill: #1e3a8a; }
  .association-end { cursor: help; }
  .sequence-frame, .sequence-lifeline, .sequence-message, .sequence-observation, .sequence-constraint { fill: none; stroke: #111111; stroke-width: 1.4; }
  .sequence-lifeline { stroke-dasharray: 7 5; }
  .annotation-line { fill: none; stroke: #8a2d2d; stroke-width: 2; }
  .annotation-label { fill: #8a2d2d; }
  a:hover .annotation-label { fill: #1e3a8a; }</style>
  </defs>
  <rect class="background" width="860" height="470"/>
  <g class="class-node" data-classifier="Tree"><title>Tree. Пример: классификатор деревьев; его специализации образуют набор обобщений с типом-степенью Tree Species.</title>
<rect class="class-box" x="80" y="40" width="130" height="50"/>
<line class="class-divider" x1="80" y1="72" x2="210" y2="72"/>
<text class="class-name" x="145.0" y="63" text-anchor="middle">Tree</text>
</g>
<g class="class-node" data-classifier="Tree Species"><title>Tree Species. Пример: тип-степень (powertype) набора обобщений Tree — вид дерева.</title>
<rect class="class-box" x="500" y="40" width="160" height="50"/>
<line class="class-divider" x1="500" y1="72" x2="660" y2="72"/>
<text class="class-name" x="580.0" y="63" text-anchor="middle">Tree Species</text>
</g>
<g class="example-association-group"><title>Ассоциация примера: каждое дерево относится ровно к одному виду (Tree Species).</title><path class="example-association" d="M 210 65 H 500"/><path class="association-hitbox" d="M 210 65 H 500" aria-hidden="true"/>

<text class="example-label" x="285" y="51" text-anchor="end">tree</text>
<text class="example-label" x="440" y="51" text-anchor="end">tree species</text>
<text class="example-label" x="222" y="87">*</text>
<text class="example-label" x="488" y="87" text-anchor="end">1</text>
</g>
<path class="generalization-line" d="M 240 185 H 210 V 125 H 120 V 90" data-child="Tree kinds" data-parent="Tree" marker-end="url(#generalization)"/>
<path class="generalization-line" d="M 240 255 H 210" data-child="Apricot" data-parent="Tree"/>
<path class="generalization-line" d="M 240 325 H 210" data-child="American Elm" data-parent="Tree"/>
<path class="generalization-line" d="M 240 395 H 210" data-child="Saguaro" data-parent="Tree"/>
<text class="association-label" x="197" y="147" text-anchor="end"><title>Тип-степень (powertype) набора: каждому виду дерева соответствует экземпляр Tree Species.</title>: TreeSpecies</text>
<text class="association-label" x="218" y="147"><title>Набор обобщений несовместный (disjoint) и непокрывающий (incomplete): экземпляр относится не более чем к одному специальному классификатору.</title>{disjoint, incomplete}</text>
<g class="class-node" data-classifier="Sugar Maple"><title>Sugar Maple. Пример: вид дерева — специализация Tree.</title>
<rect class="class-box" x="240" y="160" width="140" height="50"/>
<line class="class-divider" x1="240" y1="192" x2="380" y2="192"/>
<text class="class-name" x="310.0" y="183" text-anchor="middle">Sugar Maple</text>
</g>
<g class="class-node" data-classifier="Apricot"><title>Apricot. Пример: вид дерева — специализация Tree.</title>
<rect class="class-box" x="240" y="230" width="140" height="50"/>
<line class="class-divider" x1="240" y1="262" x2="380" y2="262"/>
<text class="class-name" x="310.0" y="253" text-anchor="middle">Apricot</text>
</g>
<g class="class-node" data-classifier="American Elm"><title>American Elm. Пример: вид дерева — специализация Tree.</title>
<rect class="class-box" x="240" y="300" width="140" height="50"/>
<line class="class-divider" x1="240" y1="332" x2="380" y2="332"/>
<text class="class-name" x="310.0" y="323" text-anchor="middle">American Elm</text>
</g>
<g class="class-node" data-classifier="Saguaro"><title>Saguaro. Пример: вид дерева — специализация Tree.</title>
<rect class="class-box" x="240" y="370" width="140" height="50"/>
<line class="class-divider" x1="240" y1="402" x2="380" y2="402"/>
<text class="class-name" x="310.0" y="393" text-anchor="middle">Saguaro</text>
</g>
<g class="class-node" data-classifier="Geographic Location"><title>Geographic Location. Пример: географическое местоположение дерева или вида.</title>
<rect class="class-box" x="420" y="280" width="190" height="55"/>
<line class="class-divider" x1="420" y1="312" x2="610" y2="312"/>
<text class="class-name" x="515.0" y="303" text-anchor="middle">Geographic Location</text>
</g>
<g class="class-node" data-classifier="Leaf Pattern"><title>Leaf Pattern. Пример: листовой узор (форма листьев), характерный для вида дерева.</title>
<rect class="class-box" x="660" y="280" width="130" height="55"/>
<line class="class-divider" x1="660" y1="312" x2="790" y2="312"/>
<text class="class-name" x="725.0" y="303" text-anchor="middle">Leaf Pattern</text>
</g>
<g class="example-association-group"><title>Ассоциация примера: вид дерева имеет общие местонахождения, дерево — фактическое.</title><path class="example-association" d="M 520 90 V 180 H 460 V 280"/><path class="association-hitbox" d="M 520 90 V 180 H 460 V 280" aria-hidden="true"/>

<text class="example-label" x="508" y="140" text-anchor="end">general locations</text>
<text class="example-label" x="508" y="158" text-anchor="end">*</text>
<text class="example-label" x="500" y="250">actual location</text>
<text class="example-label" x="500" y="266">1</text>
</g>
<g class="example-association-group"><title>Ассоциация примера: каждому виду дерева соответствует один листовой узор.</title><path class="example-association" d="M 620 90 V 190 H 690 V 280"/><path class="association-hitbox" d="M 620 90 V 190 H 690 V 280" aria-hidden="true"/>

<text class="example-label" x="632" y="150">leaf pattern</text>
<text class="example-label" x="632" y="168">1</text>
</g>
</svg>
