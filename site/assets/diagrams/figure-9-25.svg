<text class="class-name" x="755.0" y="83" text-anchor="middle">Vehicle</text>
</g>
<g class="class-node" data-classifier="Vehicle Type"><title>Vehicle Type. Пример: тип транспортного средства — тип-степень набора обобщений Vehicle.</title>
