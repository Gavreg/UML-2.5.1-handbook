<line class="class-divider" x1="60" y1="572" x2="210" y2="572"/>
<text class="class-name" x="135.0" y="563" text-anchor="middle">ChickenPox</text>
</g>
<g class="class-node" data-classifier="Measles"><title>Measles. Пример: вид заболевания — специализация Disease Occurrence.</title>
<rect class="class-box" x="60" y="620" width="150" height="55"/>
<line class="class-divider" x1="60" y1="652" x2="210" y2="652"/>
<text class="class-name" x="135.0" y="643" text-anchor="middle">Measles</text>
</g>
<text class="example-label" x="60" y="710">(c) Пример «случай заболевания / классификация»</text>
<g class="class-node" data-classifier="Installed Telephone Service"><title>Installed Telephone Service. Пример: установленная телефонная услуга.</title>
