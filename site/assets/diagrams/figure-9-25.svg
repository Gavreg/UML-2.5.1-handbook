<path class="generalization-line" d="M 650 647 H 630" data-child="Call Transferring" data-parent="Installed Telephone Service"/>
<text class="association-label" x="850" y="510"><title>Набор обобщений несовместный (disjoint) и непокрывающий (incomplete): экземпляр относится не более чем к одному специальному классификатору.</title>{disjoint, incomplete}</text>
<text class="association-label" x="850" y="526"><title>Тип-степень (powertype) набора: каждой услуге соответствует экземпляр Telephone Service Category.</title>:TelephoneServiceCategory</text>
