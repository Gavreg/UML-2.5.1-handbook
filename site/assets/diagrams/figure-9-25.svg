</g>
<g class="example-association-group"><title>Ассоциация примера: случай заболевания относится к классификации.</title><path class="example-association" d="M 260 427 H 400"/><path class="association-hitbox" d="M 260 427 H 400" aria-hidden="true"/>

<text class="example-label" x="360" y="413" text-anchor="end">disease</text>
<text class="example-label" x="388" y="413" text-anchor="end">1</text>
<text class="example-label" x="272" y="449">*</text>
<text class="example-label" x="272" y="465">classification</text>
</g>
<path class="generalization-line" d="M 60 567 H 40 V 500 H 130 V 455" data-child="Disease kinds" data-parent="Disease Occurrence" marker-end="url(#generalization)"/>
<path class="generalization-line" d="M 60 647 H 40" data-child="Measles" data-parent="Disease Occurrence"/>
<text class="association-label" x="230" y="510"><title>Набор обобщений несовместный (disjoint) и непокрывающий (incomplete): экземпляр относится не более чем к одному специальному классификатору.</title>{disjoint, incomplete}</text>
<text class="association-label" x="230" y="526"><title>Тип-степень (powertype) набора: каждой болезни соответствует экземпляр Disease Classification.</title>:DiseaseClassification</text>
<g class="class-node" data-classifier="ChickenPox"><title>ChickenPox. Пример: вид заболевания — специализация Disease Occurrence.</title>
