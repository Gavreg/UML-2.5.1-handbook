</g>
<g class="example-association-group"><title>Ассоциация примера: транспортное средство относится к типу транспорта.</title><path class="example-association" d="M 820 85 H 1000"/><path class="association-hitbox" d="M 820 85 H 1000" aria-hidden="true"/>

<text class="example-label" x="930" y="71" text-anchor="end">vehicle</text>
<text class="example-label" x="988" y="71" text-anchor="end">1</text>
<text class="example-label" x="832" y="107">*</text>
<text class="example-label" x="832" y="123">vehicle type</text>
</g>
<path class="generalization-line" d="M 660 237 H 640 V 160 H 720 V 110" data-child="Vehicle kinds" data-parent="Vehicle" marker-end="url(#generalization)"/>
<path class="generalization-line" d="M 660 317 H 640" data-child="Car" data-parent="Vehicle"/>
<text class="association-label" x="800" y="180"><title>Набор обобщений несовместный (disjoint) и непокрывающий (incomplete): экземпляр относится не более чем к одному специальному классификатору.</title>{disjoint, incomplete}</text>
<text class="association-label" x="800" y="196"><title>Тип-степень (powertype) набора: каждому виду транспорта соответствует экземпляр Vehicle Type.</title>:VehicleType</text>
<g class="class-node" data-classifier="Truck"><title>Truck. Пример: вид транспортного средства — специализация Vehicle.</title>
<rect class="class-box" x="660" y="210" width="150" height="55"/>
<line class="class-divider" x1="660" y1="242" x2="810" y2="242"/>
<text class="class-name" x="735.0" y="233" text-anchor="middle">Truck</text>
</g>
<g class="class-node" data-classifier="Car"><title>Car. Пример: вид транспортного средства — специализация Vehicle.</title>
<rect class="class-box" x="660" y="290" width="150" height="55"/>
<line class="class-divider" x1="660" y1="322" x2="810" y2="322"/>
<text class="class-name" x="735.0" y="313" text-anchor="middle">Car</text>
</g>
<text class="example-label" x="660" y="380">(b) Пример «транспортное средство / тип транспорта»</text>
