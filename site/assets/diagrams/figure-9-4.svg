<text class="association-end" x="1480" y="268" text-anchor="end"><title>constrainingClassifier. Связывает ограничивающий классификатор с параметрами шаблона классификатора, которые им ограничиваются.</title>+ constrainingClassifier</text>
<text class="association-end" x="1480" y="472" text-anchor="end"><title>classifierTemplateParameter. Связывает ограничивающий классификатор с параметрами шаблона классификатора, которые им ограничиваются.</title>+ classifierTemplateParameter</text>
<text class="association-label" x="1480" y="284" text-anchor="end">*</text>
<text class="association-label" x="1480" y="456" text-anchor="end">*</text>
