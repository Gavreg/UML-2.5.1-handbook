<circle class="end-dot" cx="1100" cy="230" r="3"/><circle class="end-dot" cx="1100" cy="500" r="3"/>
<text class="association-end" x="1120" y="268"><title>parameteredElement. Связывает классификатор с параметром шаблона классификатора, представляющим его как формальный параметр шаблона.</title>+ parameteredElement</text>
<text class="association-end" x="1120" y="472"><title>templateParameter. Связывает классификатор с параметром шаблона классификатора, представляющим его как формальный параметр шаблона.</title>+ templateParameter</text>
<text class="association-label" x="1120" y="284">{redefines parameteredElement}</text>
<text class="association-label" x="1120" y="300">1</text>
<text class="association-label" x="1120" y="456">{redefines templateParameter}</text>
<text class="association-label" x="1120" y="440">0..1</text>
</g></a>
<a class="association-link" href="../../index.html#/association/a-constrainingclassifier-classifiertemplateparameter" target="_top" aria-label="Открыть описание ассоциации A_constrainingClassifier_classifierTemplateParameter">
<g class="association-group" id="A_constrainingClassifier_classifierTemplateParameter"><title>Связывает ограничивающий классификатор с параметрами шаблона классификатора, которые им ограничиваются.</title>
