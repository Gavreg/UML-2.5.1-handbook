<rect class="class-box" x="1080" y="20" width="250" height="60"/>
<line class="class-divider" x1="1080" y1="52" x2="1330" y2="52"/>
<text class="class-name abstract" x="1205.0" y="43" text-anchor="middle">TemplateableElement</text>
</a>
<a class="class-node" data-classifier="RedefinableTemplateSignature" href="../../index.html#/classifier/redefinabletemplatesignature" target="_top" aria-label="RedefinableTemplateSignature — открыть описание класса"><title>RedefinableTemplateSignature. Поддерживает добавление формальных параметров шаблона в специализации шаблонного классификатора.</title>
