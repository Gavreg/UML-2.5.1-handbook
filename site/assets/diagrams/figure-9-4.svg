<circle class="end-dot" cx="180" cy="390" r="3"/><circle class="end-dot" cx="180" cy="560" r="3"/>
<text class="association-end" x="200" y="428"><title>redefinableTemplateSignature. Связывает унаследованный параметр подписи шаблона с переопределяемыми подписями шаблона, в которых он унаследован.</title>+ redefinableTemplateSignature</text>
<text class="association-end" x="200" y="532"><title>inheritedParameter. Связывает унаследованный параметр подписи шаблона с переопределяемыми подписями шаблона, в которых он унаследован.</title>+ /inheritedParameter</text>
<text class="association-label" x="200" y="444">{subsets templateSignature}</text>
<text class="association-label" x="200" y="460">*</text>
<text class="association-label" x="200" y="516">{readOnly, subsets parameter}</text>
<text class="association-label" x="200" y="500">*</text>
</g></a>
<a class="association-link" href="../../index.html#/association/a-classifier-templateparameter-parameteredelement" target="_top" aria-label="Открыть описание ассоциации A_classifier_templateParameter_parameteredElement">
<g class="association-group" id="A_classifier_templateParameter_parameteredElement"><title>Связывает классификатор с параметром шаблона классификатора, представляющим его как формальный параметр шаблона.</title>
