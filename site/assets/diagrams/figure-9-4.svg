<a class="association-link" href="../../index.html#/association/a-ownedtemplatesignature-classifier" target="_top" aria-label="Открыть описание ассоциации A_ownedTemplateSignature_classifier">
<g class="association-group" id="A_ownedTemplateSignature_classifier"><title>Связывает переопределяемую подпись шаблона с владеющим ею классификатором.</title>
<path class="association" d="M 460 210 H 1050"/><path class="association-hitbox" d="M 460 210 H 1050" aria-hidden="true"/>
<circle class="end-dot" cx="460" cy="210" r="3"/><polygon class="composition" points="1050,210 1042,202 1034,210 1042,218"/>
<text class="association-end" x="480" y="190"><title>ownedTemplateSignature. Связывает переопределяемую подпись шаблона с владеющим ею классификатором.</title>+ ownedTemplateSignature</text>
<text class="association-end" x="1030" y="190" text-anchor="end"><title>classifier. Связывает переопределяемую подпись шаблона с владеющим ею классификатором.</title>+ classifier</text>
<text class="association-label" x="480" y="170">{subsets redefinableElement,</text>
<text class="association-label" x="480" y="154">redefines ownedTemplateSignature}</text>
<text class="association-label" x="480" y="138">0..1</text>
<text class="association-label" x="1030" y="170" text-anchor="end">{subsets redefinitionContext,</text>
<text class="association-label" x="1030" y="154" text-anchor="end">redefines template}</text>
<text class="association-label" x="1030" y="138" text-anchor="end">0..1</text>
</g></a>
<a class="association-link" href="../../index.html#/association/a-extendedsignature-redefinabletemplatesignature" target="_top" aria-label="Открыть описание ассоциации A_extendedSignature_redefinableTemplateSignature">
<g class="association-group" id="A_extendedSignature_redefinableTemplateSignature"><title>Связывает расширенные подписи с переопределяемой подписью шаблона, которая их расширяет.</title>
<path class="association" d="M 460 330 H 740 V 480 H 420 V 390"/><path class="association-hitbox" d="M 460 330 H 740 V 480 H 420 V 390" aria-hidden="true"/>

<text class="association-end" x="480" y="310"><title>redefinableTemplateSignature. Связывает расширенные подписи с переопределяемой подписью шаблона, которая их расширяет.</title>+ redefinableTemplateSignature</text>
<text class="association-end" x="440" y="428"><title>Подписи шаблонов, расширяемые этой переопределяемой подписью шаблона.</title>+ extendedSignature</text>
<text class="association-label" x="480" y="290">{subsets redefinableElement}</text>
<text class="association-label" x="480" y="274">*</text>
<text class="association-label" x="440" y="444">{subsets redefinedElement}</text>
<text class="association-label" x="440" y="460">*</text>
</g></a>
<a class="association-link" href="../../index.html#/association/a-inheritedparameter-redefinabletemplatesignature" target="_top" aria-label="Открыть описание ассоциации A_inheritedParameter_redefinableTemplateSignature">
<g class="association-group" id="A_inheritedParameter_redefinableTemplateSignature"><title>Связывает унаследованный параметр подписи шаблона с переопределяемыми подписями шаблона, в которых он унаследован.</title>
