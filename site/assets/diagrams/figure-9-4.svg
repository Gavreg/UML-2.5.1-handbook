<line class="class-divider" x1="1050" y1="202" x2="1500" y2="202"/>
<text class="class-name abstract" x="1275.0" y="193" text-anchor="middle">Classifier</text>
</a>
<a class="class-node" data-classifier="TemplateParameter" href="../../index.html#/classifier/templateparameter" target="_top" aria-label="TemplateParameter — открыть описание класса"><title>TemplateParameter. Представляет ParameterableElement как формальный параметр шаблона.</title>
<rect class="class-box" x="80" y="560" width="220" height="60"/>
<line class="class-divider" x1="80" y1="592" x2="300" y2="592"/>
<text class="class-name" x="190.0" y="583" text-anchor="middle">TemplateParameter</text>
</a>
<a class="class-node" data-classifier="ClassifierTemplateParameter" href="../../index.html#/classifier/classifiertemplateparameter" target="_top" aria-label="ClassifierTemplateParameter — открыть описание класса"><title>ClassifierTemplateParameter. Представляет Classifier как формальный параметр шаблона.</title>
<rect class="class-box" x="1000" y="500" width="500" height="90"/>
<line class="class-divider" x1="1000" y1="532" x2="1500" y2="532"/>
<text class="class-name" x="1250.0" y="523" text-anchor="middle">ClassifierTemplateParameter</text>
<text class="attribute" x="1010" y="554">+ allowSubstitutable : Boolean = true</text>
</a>
<path class="generalization-line" d="M 220 170 V 80" data-child="RedefinableTemplateSignature" data-parent="RedefinableElement" marker-end="url(#generalization)"/>
<path class="generalization-line" d="M 400 170 H 300 V 80 H 430" data-child="RedefinableTemplateSignature" data-parent="TemplateSignature" marker-end="url(#generalization)"/>
