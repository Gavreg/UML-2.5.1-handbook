<text class="attribute" x="432" y="62">CarEngine:&gt;Engine,</text>
<text class="attribute" x="432" y="86">n:LiteralInteger</text>
<g class="class-node" data-classifier="e : CarEngine"><title>e : CarEngine. Параметр e типа CarEngine в примере класса-шаблона Car.</title>
